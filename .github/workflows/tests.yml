name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync pytest --cov --cov-report=json:test-results/coverage.json --cov-report=xml:test-results/coverage.xml
      - run: uv run --no-sync python scripts/check_coverage.py test-results/coverage.json
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/coverage.json,test-results/coverage.xml
          fail_ci_if_error: false
      - run: uv run --no-sync python scripts/check_sources.py
      - run: uv run --no-sync python scripts/check_metadata.py
      - run: uv run --no-sync ruff check src tests examples scripts
      - if: matrix.python == '3.12'
        run: uv run --no-sync mypy src/negotiator
      - run: uv run --no-sync python examples/custom_agent.py --output test-results/custom-agent
      - run: uv run --no-sync negotiator run examples/study.json --synthetic --output test-results/study
      - run: uv run --no-sync negotiator report test-results/study --output test-results/report
      - run: uv build
      - run: uv venv test-results/wheel-env --python ${{ matrix.python }}
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then wheel_python=test-results/wheel-env/Scripts/python.exe; else wheel_python=test-results/wheel-env/bin/python; fi
          uv pip install --python "$wheel_python" -c requirements.lock dist/*.whl
          "$wheel_python" scripts/check_install.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --locked --python 3.12
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/negotiator/web/static
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test -- --reporter=line
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          retention-days: 14
          name: browser-failure-traces
          path: frontend/test-results/
